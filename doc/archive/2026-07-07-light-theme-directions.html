<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hiven Light 主题 · 三个方向</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #d8d8dc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x: auto; }

  .page-header { padding: 28px 32px 20px; text-align: center; }
  .page-header h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; color: #18181b; }
  .page-header p { margin: 0 0 6px; font-size: 13px; color: #55555e; }
  .page-header p.note { font-size: 12px; color: #8a8a8a; }

  .compare-grid { display: flex; min-width: max-content; min-height: 100vh; align-items: stretch; }
  .col { width: 360px; flex: 0 0 360px; padding: 24px 24px 60px; }
  .col + .col { border-left: 1px solid rgba(0,0,0,.08); }

  .col-title { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .col-title .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: .5px;
    background: var(--surface-3); color: var(--accent); }
  .col-title h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .col-title .sub { font-size: 11px; color: var(--text-tertiary); flex-basis: 100%; margin-top: 2px; }

  .block { margin-bottom: 24px; }
  .block-label { font-size: 11px; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .4px; opacity: .55; }

  /* 1. 色板条 */
  .swatch-row { display: flex; gap: 8px; }
  .swatch { flex: 1; height: 64px; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 6px 8px; font-size: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .swatch .name { font-size: 9px; opacity: .7; margin-bottom: 2px; }

  /* 2. 文字层级 */
  .type-sample .t1 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .type-sample .t2 { font-size: 13px; font-weight: 400; margin: 0 0 6px; }
  .type-sample .t3 { font-size: 12px; font-weight: 400; margin: 0 0 6px; }
  .type-sample .t4 { font-size: 11px; font-weight: 400; margin: 0; }

  /* 卡片通用 */
  .card { border-radius: 10px; padding: 4px 0; }
  .group-title { font-size: 12px; font-weight: 600; margin: 0 0 8px 2px; }
  .setting-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .setting-row + .setting-row { border-top: 1px solid; }
  .row-icon { width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0; }
  .row-text { flex: 1; min-width: 0; }
  .row-text .name { font-size: 13px; font-weight: 500; margin: 0 0 2px; }
  .row-text .desc { font-size: 11px; margin: 0; }

  .toggle { width: 36px; height: 20px; border-radius: 999px; position: relative; flex-shrink: 0; }
  .toggle::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff;
    top: 2px; right: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.25); }

  .fake-select { font-size: 12px; padding: 5px 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap; }
  .fake-select .chev { font-size: 9px; opacity: .6; }

  .fake-stepper { display: flex; align-items: center; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .fake-stepper button { width: 22px; height: 24px; border: none; font-size: 13px; line-height: 1; cursor: default; background: transparent; }
  .fake-stepper .val { font-size: 12px; padding: 0 8px; min-width: 20px; text-align: center; }

  /* 4. 列表 */
  .list-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; margin: 0 4px; cursor: default; }
  .list-row .icon-dot { width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0; }
  .list-row .label { font-size: 12.5px; flex: 1; }
  .list-row .tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; flex-shrink: 0; }

  /* 5. 按钮组 */
  .btn-row { display: flex; align-items: center; gap: 10px; }
  .btn { font-size: 12.5px; font-weight: 500; padding: 7px 16px; border-radius: 7px; cursor: default; border: 1px solid transparent; transition: background-color .12s ease; }
  .btn-danger { background: transparent; border: none; padding: 7px 4px; }

  /* 6. 悬浮菜单 */
  .menu { width: 200px; border-radius: 10px; padding: 6px; }
  .menu-item { font-size: 12.5px; padding: 8px 10px; border-radius: 6px; cursor: default; transition: background-color .12s ease; }

  /* 7. 浮层面板 */
  .launcher-mini { width: 300px; border-radius: 12px; padding: 10px; }
  .launcher-mini .input { font-size: 13px; padding: 9px 12px; border-radius: 8px; margin-bottom: 8px; }
  .launcher-mini .result-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; transition: background-color .12s ease; }
  .launcher-mini .result-row .icon-dot { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; }
  .launcher-mini .result-row .label { font-size: 12.5px; }

  .list-row { transition: background-color .12s ease; }

  /* ============================================================
     以下为“皮肤层”：三列共用同一套组件规则，全部通过 CSS 变量取值，
     每列真正不同的只有 .col-a / .col-b / .col-c 里声明的变量本身。
     ============================================================ */

  .col { background: var(--bg-page); color: var(--text-primary); }
  .text-primary { color: var(--text-primary); }
  .text-secondary { color: var(--text-secondary); }
  .text-tertiary { color: var(--text-tertiary); }
  .border-c { border-color: var(--border) !important; }
  .accent-text { color: var(--accent-text); }

  .swatch { border: 1px solid var(--border); color: var(--text-primary); }
  .swatch:nth-child(1) { background: var(--bg-page); }
  .swatch:nth-child(2) { background: var(--surface); }
  .swatch:nth-child(3) { background: var(--surface-2); }
  .swatch:nth-child(4) { background: var(--surface-3); }
  .swatch:nth-child(5) { background: var(--border); }

  .card, .list-card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--card-shadow); }
  .setting-row + .setting-row { border-top-color: var(--divider); }
  .row-icon { background: var(--surface-2); }
  .toggle-on { background: var(--accent); }
  .fake-select { background: var(--surface-2); color: var(--text-primary); }
  .fake-stepper { border: 1px solid var(--border); }
  .fake-stepper button { color: var(--text-secondary); }
  .fake-stepper .val { color: var(--text-primary); }

  .list-row .icon-dot { background: var(--surface-2); }
  .list-row.selected { background: var(--selected-bg); }
  .list-row.selected .icon-dot { background: var(--selected-icon-bg); }
  .list-row.selected .label { color: var(--selected-fg); font-weight: 600; }
  .list-row .tag { background: var(--surface-3); color: var(--text-tertiary); }
  .list-row.hoverable:hover { background: var(--hover-bg); }
  .list-row.hoverable:active { background: var(--active-bg); }

  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--surface); color: var(--text-primary); border-color: var(--border); }
  .btn-secondary:hover { background: var(--hover-bg); }
  .btn-danger { color: #dc2626; }

  .menu { background: var(--surface); box-shadow: var(--menu-shadow); }
  .menu-item { color: var(--text-primary); }
  .menu-item:hover { background: var(--hover-bg); }

  .launcher-mini { background: var(--surface); box-shadow: var(--float-shadow); }
  .launcher-mini .input { background: var(--surface-2); color: var(--text-secondary); box-shadow: inset 0 0 0 1px var(--border); }
  .launcher-mini .result-row.selected { background: var(--selected-bg); }
  .launcher-mini .result-row.hoverable:hover { background: var(--hover-bg); }
  .launcher-mini .icon-dot { background: var(--surface-2); }

  /* ============ 方向 A · 墨调 Ink ============ */
  .col-a {
    --bg-page: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --surface-3: #ececee;
    --text-primary: #111113;
    --text-secondary: #56565c;
    --text-tertiary: #8f8f96;
    --border: #e8e8e8;
    --divider: #f0f0f2;
    --accent: #18181b;
    --accent-hover: #2d2d31;
    --accent-fg: #ffffff;
    --accent-text: #2563eb;
    --selected-bg: #ececee;
    --selected-icon-bg: #18181b;
    --selected-fg: var(--text-primary);
    --hover-bg: rgba(0,0,0,.045);
    --active-bg: rgba(0,0,0,.08);
    --card-shadow: none;
    --menu-shadow: 0 8px 24px rgba(0,0,0,.08);
    --float-shadow: 0 16px 48px -16px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.06);
  }

  /* ============ 方向 B · 暖纸 Paper ============ */
  .col-b {
    --bg-page: #f7f6f3;
    --surface: #fefdfb;
    --surface-2: #f3f1ec;
    --surface-3: #eae7e0;
    --text-primary: #1d1b16;
    --text-secondary: #5f5b52;
    --text-tertiary: #928f86;
    --border: #e7e4dc;
    --divider: #efece5;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-fg: #ffffff;
    --accent-text: #2563eb;
    --selected-bg: #e9eefb;
    --selected-icon-bg: #2563eb;
    --selected-fg: var(--accent);
    --hover-bg: rgba(60,50,30,.05);
    --active-bg: rgba(60,50,30,.09);
    --card-shadow: 0 1px 3px rgba(60,50,30,.06);
    --menu-shadow: 0 4px 14px rgba(60,50,30,.10), 0 0 0 1px rgba(60,50,30,.04);
    --float-shadow: 0 20px 50px -16px rgba(60,50,30,.16), 0 0 0 1px rgba(60,50,30,.05);
  }

  /* ============ 方向 C · 冷雾 Iris ============ */
  .col-c {
    --bg-page: #f7f7fa;
    --surface: #ffffff;
    --surface-2: #f1f1f6;
    --surface-3: #e9e9f0;
    --text-primary: #17171c;
    --text-secondary: #55555f;
    --text-tertiary: #8d8d99;
    --border: #e3e3ea;
    --divider: #ededf2;
    --accent: #5e6ad2;
    --accent-hover: #5259bd;
    --accent-fg: #ffffff;
    --accent-text: #5e6ad2;
    --selected-bg: #edeefb;
    --selected-icon-bg: #5e6ad2;
    --selected-fg: var(--accent);
    --hover-bg: rgba(23,23,40,.05);
    --active-bg: rgba(23,23,40,.09);
    --card-shadow: 0 1px 2px rgba(23,23,40,.05);
    --menu-shadow: 0 4px 12px rgba(23,23,40,.10), 0 0 0 1px rgba(23,23,40,.04);
    --float-shadow: 0 16px 40px -12px rgba(23,23,40,.18), 0 0 0 1px rgba(23,23,40,.06);
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>hiven Light 主题 · 三个方向</h1>
  <p>三列使用同一份组件模板渲染（色板条 / 文字层级 / 设置卡片 / 列表选中 &amp; hover / 按钮组 / 悬浮菜单 / 迷你 launcher 浮层），仅 CSS 变量取值不同。鼠标悬停列表行、按钮、菜单项可感受各方向真实的 hover 反馈。</p>
  <p class="note">备注：A、C 会改变 light accent（现 #2563eb）。</p>
</div>

<div class="compare-grid">
  <div class="col col-a">
    <div class="col-title">
      <span class="badge">A</span>
      <h2>墨调 Ink</h2>
      <span class="sub">墨调 · 黑白极致</span>
    </div>
    <div id="body-a"></div>
  </div>

  <div class="col col-b">
    <div class="col-title">
      <span class="badge">B</span>
      <h2>暖纸 Paper</h2>
      <span class="sub">暖纸 · 书房感 · accent 不变</span>
    </div>
    <div id="body-b"></div>
  </div>

  <div class="col col-c">
    <div class="col-title">
      <span class="badge">C</span>
      <h2>冷雾 Iris</h2>
      <span class="sub">冷雾 · Iris accent</span>
    </div>
    <div id="body-c"></div>
  </div>
</div>

<script>
  // 三列使用同一套组件模板渲染，仅传入不同的色值标签和文案，
  // 保证三列的 DOM 结构完全一致，差异只来自各自的 CSS 变量取值。
  function renderBody(v) {
    const swatchHtml = v.swatches.map(function (s) {
      return '<div class="swatch"><span class="name">' + s.name + '</span>' + s.hex + '</div>';
    }).join('');

    return '' +
      '<div class="block">' +
      '  <div class="block-label text-tertiary">灰阶色板</div>' +
      '  <div class="swatch-row">' + swatchHtml + '</div>' +
      '</div>' +

      '<div class="block type-sample">' +
      '  <div class="block-label text-tertiary">文字层级</div>' +
      '  <p class="t1 text-primary">主标题文字样式</p>' +
      '  <p class="t2 text-primary">正文文字样式，用于常规内容展示。</p>' +
      '  <p class="t3 text-secondary">次要说明文字，用于补充描述信息。</p>' +
      '  <p class="t4 text-tertiary">三级提示文字，用于弱化的辅助信息</p>' +
      '</div>' +

      '<div class="block">' +
      '  <div class="block-label text-tertiary">设置卡片</div>' +
      '  <p class="group-title text-secondary">通用</p>' +
      '  <div class="card">' +
      '    <div class="setting-row">' +
      '      <div class="row-icon"></div>' +
      '      <div class="row-text"><p class="name text-primary">开机自启动</p><p class="desc text-secondary">系统启动时自动运行 hiven</p></div>' +
      '      <div class="toggle toggle-on"></div>' +
      '    </div>' +
      '    <div class="setting-row">' +
      '      <div class="row-icon"></div>' +
      '      <div class="row-text"><p class="name text-primary">界面语言</p><p class="desc text-secondary">影响所有菜单与提示文案</p></div>' +
      '      <div class="fake-select"><span>简体中文</span><span class="chev">▾</span></div>' +
      '    </div>' +
      '    <div class="setting-row">' +
      '      <div class="row-icon"></div>' +
      '      <div class="row-text"><p class="name text-primary">字体大小</p><p class="desc text-secondary">调整编辑区默认字号</p></div>' +
      '      <div class="fake-stepper"><button>－</button><span class="val">14</span><button>＋</button></div>' +
      '    </div>' +
      '  </div>' +
      '</div>' +

      '<div class="block">' +
      '  <div class="block-label text-tertiary">列表</div>' +
      '  <div class="list-card card">' +
      '    <div class="list-row hoverable"><div class="icon-dot"></div><span class="label text-primary">文本对比</span></div>' +
      '    <div class="list-row selected"><div class="icon-dot"></div><span class="label">JSON 对比</span></div>' +
      '    <div class="list-row hoverable"><div class="icon-dot"></div><span class="label text-primary">Markdown 对比</span><span class="tag">' + v.hoverTag + '</span></div>' +
      '    <div class="list-row hoverable"><div class="icon-dot"></div><span class="label text-primary">正则测试</span></div>' +
      '  </div>' +
      '</div>' +

      '<div class="block">' +
      '  <div class="block-label text-tertiary">按钮组</div>' +
      '  <div class="btn-row">' +
      '    <button class="btn btn-primary">主要操作</button>' +
      '    <button class="btn btn-secondary border-c">次要操作</button>' +
      '    <button class="btn btn-danger">删除</button>' +
      '  </div>' +
      '</div>' +

      '<div class="block">' +
      '  <div class="block-label text-tertiary">悬浮菜单</div>' +
      '  <div class="menu">' +
      '    <div class="menu-item text-primary">重命名</div>' +
      '    <div class="menu-item text-primary">复制路径</div>' +
      '    <div class="menu-item text-primary" style="color:#dc2626;">删除</div>' +
      '  </div>' +
      '</div>' +

      '<div class="block">' +
      '  <div class="block-label text-tertiary">浮层面板（Launcher 迷你态）</div>' +
      '  <div class="launcher-mini">' +
      '    <div class="input text-secondary">搜索命令或插件…</div>' +
      '    <div class="result-row selected"><div class="icon-dot"></div><span class="label accent-text">Base64 编码</span></div>' +
      '    <div class="result-row hoverable"><div class="icon-dot"></div><span class="label text-primary">URL 编码</span></div>' +
      '  </div>' +
      '</div>';
  }

  document.getElementById('body-a').innerHTML = renderBody({
    swatches: [
      { name: 'bg-page', hex: '#fafafa' },
      { name: 'surface', hex: '#ffffff' },
      { name: 'surface-2', hex: '#f4f4f5' },
      { name: 'surface-3', hex: '#ececee' },
      { name: 'border', hex: '#e8e8e8' }
    ],
    hoverTag: 'hover 态（试试悬停）'
  });

  document.getElementById('body-b').innerHTML = renderBody({
    swatches: [
      { name: 'bg-page', hex: '#f7f6f3' },
      { name: 'surface', hex: '#fefdfb' },
      { name: 'surface-2', hex: '#f3f1ec' },
      { name: 'surface-3', hex: '#eae7e0' },
      { name: 'border', hex: '#e7e4dc' }
    ],
    hoverTag: 'hover 态（试试悬停）'
  });

  document.getElementById('body-c').innerHTML = renderBody({
    swatches: [
      { name: 'bg-page', hex: '#f7f7fa' },
      { name: 'surface', hex: '#ffffff' },
      { name: 'surface-2', hex: '#f1f1f6' },
      { name: 'surface-3', hex: '#e9e9f0' },
      { name: 'border', hex: '#e3e3ea' }
    ],
    hoverTag: 'hover 态（试试悬停）'
  });
</script>

</body>
</html>
